<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSV Regular Expression Extractor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
    <style>
      .file-upload {
        position: relative;
        overflow: hidden;
        display: inline-block;
      }
      .file-upload input[type="file"] {
        position: absolute;
        left: 0;
        top: 0;
        opacity: 0;
      }
      .drag-drop-area {
        transition: all 0.3s ease;
      }
      .drag-drop-area.dragover {
        border-color: #3b82f6;
        background-color: #f0f9ff;
      }
      .preview-table {
        max-height: 400px;
        overflow-y: auto;
      }
    </style>
  </head>
  <body class="min-h-screen bg-gray-50">
    <div class="bg-blue-600 py-12 px-4 sm:px-6 lg:px-8">
      <div class="max-w-3xl mx-auto text-center">
        <h1 class="text-3xl font-bold text-white mb-4">
          CSV Regular Expression Extractor
        </h1>
        <p class="text-blue-100">
          Upload your CSV file to extract AMM references and other maintenance
          documents
        </p>
      </div>
    </div>

    <div class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 -mt-8">
      <div class="bg-white shadow-lg rounded-lg p-6 mb-8">
        <div class="mb-6">
          <div
            id="drag-drop-area"
            class="drag-drop-area mt-1 flex justify-center px-6 pt-5 pb-6 border-2 border-gray-300 border-dashed rounded-md"
          >
            <div class="space-y-1 text-center">
              <i
                data-lucide="upload"
                class="mx-auto h-12 w-12 text-gray-400"
              ></i>
              <div class="flex text-sm text-gray-600 justify-center">
                <label
                  class="file-upload relative cursor-pointer bg-white rounded-md font-medium text-blue-600 hover:text-blue-500 focus-within:outline-none focus-within:ring-2 focus-within:ring-offset-2 focus-within:ring-blue-500"
                >
                  <span>Upload a file</span>
                  <input
                    id="file-upload"
                    type="file"
                    class="sr-only"
                    accept=".csv"
                  />
                </label>
                <p class="pl-1">or drag and drop</p>
              </div>
              <p class="text-xs text-gray-500">CSV files only</p>
            </div>
          </div>
        </div>

        <div id="error-container" class="mb-4 p-4 bg-red-50 rounded-md hidden">
          <div class="flex">
            <i data-lucide="alert-triangle" class="h-5 w-5 text-red-400"></i>
            <div class="ml-3">
              <h3 class="text-sm font-medium text-red-800">Error</h3>
              <p id="error-message" class="text-sm text-red-700"></p>
            </div>
          </div>
        </div>

        <div id="processing-section" class="space-y-4 hidden">
          <div class="flex justify-between items-center">
            <span id="row-count" class="text-sm text-gray-500"></span>
            <button
              id="process-btn"
              class="px-4 py-2 border border-transparent text-sm font-medium rounded-md text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500"
            >
              Process Data
            </button>
          </div>

          <div
            id="download-section"
            class="bg-blue-50 p-6 rounded-lg text-center hidden"
          >
            <i
              data-lucide="arrow-down"
              class="mx-auto h-8 w-8 text-blue-500 mb-4"
            ></i>
            <h3 class="text-lg font-medium text-blue-900 mb-2">
              Your file is ready!
            </h3>
            <p class="text-sm text-blue-700 mb-4">
              Click the button below to download your processed CSV file
            </p>
            <button
              id="download-btn"
              class="inline-flex items-center px-6 py-3 border border-transparent text-base font-medium rounded-md text-white bg-green-600 hover:bg-green-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-green-500"
            >
              <i data-lucide="download" class="mr-2 h-5 w-5"></i>
              Download Processed CSV
            </button>
          </div>
        </div>
      </div>

      <div
        id="preview-section"
        class="bg-white shadow rounded-lg p-6 mb-8 hidden"
      >
        <h2 class="text-lg font-medium text-gray-900 mb-4">Preview</h2>
        <div class="overflow-x-auto preview-table">
          <table id="preview-table" class="min-w-full divide-y divide-gray-200">
            <thead class="bg-gray-50">
              <tr id="table-headers"></tr>
            </thead>
            <tbody
              id="table-body"
              class="bg-white divide-y divide-gray-200"
            ></tbody>
          </table>
        </div>
      </div>
    </div>

    <script>
      // Initialize Lucide icons
      lucide.createIcons();

      // Global variables to store parsed and processed data
      let parsedData = null;
      let processedData = null;

      // DOM elements
      const fileUploadInput = document.getElementById("file-upload");
      const dragDropArea = document.getElementById("drag-drop-area");
      const errorContainer = document.getElementById("error-container");
      const errorMessage = document.getElementById("error-message");
      const processingSection = document.getElementById("processing-section");
      const rowCount = document.getElementById("row-count");
      const processBtn = document.getElementById("process-btn");
      const downloadSection = document.getElementById("download-section");
      const downloadBtn = document.getElementById("download-btn");
      const previewSection = document.getElementById("preview-section");
      const tableHeaders = document.getElementById("table-headers");
      const tableBody = document.getElementById("table-body");

      // Event listeners
      fileUploadInput.addEventListener("change", handleFileUpload);
      dragDropArea.addEventListener("dragover", handleDragOver);
      dragDropArea.addEventListener("dragleave", handleDragLeave);
      dragDropArea.addEventListener("drop", handleDrop);
      processBtn.addEventListener("click", processData);
      downloadBtn.addEventListener("click", downloadCSV);

      // File upload handler
      function handleFileUpload(event) {
        const file = event.target.files[0];
        if (!file) return;

        parseCSV(file);
      }

      // Drag and drop handlers
      function handleDragOver(e) {
        e.preventDefault();
        e.stopPropagation();
        dragDropArea.classList.add("dragover");
      }

      function handleDragLeave(e) {
        e.preventDefault();
        e.stopPropagation();
        dragDropArea.classList.remove("dragover");
      }

      function handleDrop(e) {
        e.preventDefault();
        e.stopPropagation();
        dragDropArea.classList.remove("dragover");

        const file = e.dataTransfer.files[0];
        if (!file) return;

        if (file.type === "text/csv" || file.name.endsWith(".csv")) {
          parseCSV(file);
        } else {
          showError("Please upload a CSV file");
        }
      }

      // CSV parsing function
      function parseCSV(file) {
        Papa.parse(file, {
          header: true,
          complete: function (results) {
            if (results.errors.length > 0) {
              showError(`Error parsing CSV: ${results.errors[0].message}`);
              return;
            }

            parsedData = {
              data: results.data,
              columns: results.meta.fields || [],
            };

            hideError();
            showProcessingSection(results.data.length);
          },
          error: function (error) {
            showError(`Error parsing CSV: ${error.message}`);
          },
        });
      }

      // Data processing function
      function processData() {
        if (!parsedData) return;

        try {
          processedData = parsedData.data.map((row) => {
            const actionLog = row["ACTION LOG"] || "";

            // Extract AMM reference
            const ammMatch = actionLog.match(
              /(AMM|MAINTENANCE MANUAL|AMM TASK|Refer to)\s([\d-]+)/
            );
            const ammRef = ammMatch ? ammMatch[2] : "";

            // Extract other references
            const otherRefs = (
              actionLog.match(
                /(SB|CMM|SRM|SOPM|NDT|NTM B747 PART|SWPM|IAI|IAI MAINTENANCE MANUAL|WDM|AIPC|FIM)\s([\d-]+)/g
              ) || []
            ).map((match) => match.trim());

            return {
              ...row,
              "AMM REF": ammRef,
              "AMM REFERENCE TYPE": otherRefs.join(", "),
            };
          });

          showDownloadSection();
          showPreview();
        } catch (err) {
          showError(
            `Error processing data: ${
              err instanceof Error ? err.message : "Unknown error"
            }`
          );
        }
      }

      // CSV download function
      function downloadCSV() {
        if (!processedData) return;

        const csv = Papa.unparse(processedData);
        const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
        const link = document.createElement("a");
        const url = URL.createObjectURL(blob);

        link.setAttribute("href", url);
        link.setAttribute("download", "processed_data.csv");
        link.style.visibility = "hidden";
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      }

      // UI helper functions
      function showError(message) {
        errorMessage.textContent = message;
        errorContainer.classList.remove("hidden");
      }

      function hideError() {
        errorContainer.classList.add("hidden");
      }

      function showProcessingSection(count) {
        rowCount.textContent = `${count} rows loaded`;
        processingSection.classList.remove("hidden");
      }

      function showDownloadSection() {
        downloadSection.classList.remove("hidden");
      }

      function showPreview() {
        if (!processedData || processedData.length === 0) return;

        // Clear previous preview
        tableHeaders.innerHTML = "";
        tableBody.innerHTML = "";

        // Get headers from first row
        const headers = Object.keys(processedData[0]);

        // Add headers to table
        headers.forEach((header) => {
          const th = document.createElement("th");
          th.className =
            "px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider";
          th.textContent = header;
          tableHeaders.appendChild(th);
        });

        // Add first 5 rows to preview
        const previewRows = processedData.slice(0, 5);
        previewRows.forEach((row) => {
          const tr = document.createElement("tr");

          Object.values(row).forEach((value) => {
            const td = document.createElement("td");
            td.className = "px-6 py-4 whitespace-nowrap text-sm text-gray-500";
            td.textContent = value !== undefined && value !== null ? value : "";
            tr.appendChild(td);
          });

          tableBody.appendChild(tr);
        });

        previewSection.classList.remove("hidden");
      }
    </script>
  </body>
</html>
